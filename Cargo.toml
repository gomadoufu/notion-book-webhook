[package]
name = "notion-book-webhook"
version = "0.1.0"
edition = "2021"

[dependencies]
# Webフレームワーク
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# シリアライゼーション
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client（Notion APIとGoogle Books API両方で使用）
reqwest = { version = "0.12", features = ["json"] }

# 環境変数
dotenvy = "0.15"

# エラーハンドリング
anyhow = "1.0"

[profile.release]
opt-level = "z"     # サイズ最適化
lto = true          # Link Time Optimization
codegen-units = 1   # ビルド時間は長くなるがバイナリサイズ削減
strip = true        # シンボル情報を削除
